  # ─── Job 2: Build & Push Image (CI) ───────────────────────────
  build-and-push:
    name: CI - Build & Push Image to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Deploy to GCP VM (CD) ─────────────────────────────
  deploy:
    name: CD - Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure target directory exists on GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: mkdir -p ~/bekal

      - name: Copy docker-compose.yml to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/bekal"

      - name: Deploy and restart container on GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/bekal

            echo "⚙️ Configuring environment (.env)..."
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF
              echo "✅ .env created from ENV_FILE secret."
            else
              cat << 'EOF' > .env
            # ─── Database
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME || 'sa' }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            # ─── Redis
            REDIS_HOST=${{ secrets.REDIS_HOST || 'redis' }}
            REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD || '' }}

            # ─── JWT
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_TTL_MINUTES=${{ secrets.JWT_TTL_MINUTES || '180m' }}

            # ─── Mail
            MAIL_HOST=${{ secrets.MAIL_HOST || 'smtp.gmail.com' }}
            MAIL_PORT=${{ secrets.MAIL_PORT || '587' }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}

            # ─── App Configurations
            JPA_DDL_AUTO=${{ secrets.JPA_DDL_AUTO || 'none' }}
            JPA_SHOW_SQL=${{ secrets.JPA_SHOW_SQL || 'true' }}
            UPLOAD_DIR=${{ secrets.UPLOAD_DIR || 'uploads' }}
            MAX_FILE_SIZE=${{ secrets.MAX_FILE_SIZE || '10MB' }}
            MAX_REQUEST_SIZE=${{ secrets.MAX_REQUEST_SIZE || '10MB' }}
            CACHE_LOG_LEVEL=${{ secrets.CACHE_LOG_LEVEL || 'WARN' }}
            SQL_LOG_LEVEL=${{ secrets.SQL_LOG_LEVEL || 'WARN' }}
            EOF
              echo "✅ .env mapped from individual secrets and default fallbacks."
            fi
            chmod 600 .env

            echo "🔑 Logging in to GHCR..."
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📥 Pulling latest image from GHCR..."
            docker compose pull app

            echo "🚀 Starting updated app container with .env configuration..."
            docker compose up -d --no-deps --force-recreate app

            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Deployed successfully!"
