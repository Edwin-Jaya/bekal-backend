# ─── App ─────────────────────────────────────────────────────
spring.application.name=bekal
spring.config.import=optional:file:.env[.properties]
# ─── Database ────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# ─── Session ─────────────────────────────────────────────────
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# ─── Redis ───────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# ─── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
spring.web.resources.static-locations=file:uploads/

# ─── Mail ────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── JWT ─────────────────────────────────────────────────────
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-ttl-minutes=${JWT_TTL_MINUTES:180m}

# ─── Upload Dir ──────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:uploads}

# ─── Logging ─────────────────────────────────────────────────
logging.level.org.springframework.cache=${CACHE_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}

# ─── Firebase ────────────────────────────────────────────────
firebase.service-account-file=${FIREBASE_CREDENTIALS_JSON}